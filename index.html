<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lavakids · Versión definitiva</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e4ee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.phone{width:390px;height:844px;margin:18px auto;background:#fff;border-radius:34px;box-shadow:0 18px 50px #0003;overflow:hidden;position:relative}.screen{height:100%;overflow:auto;padding-bottom:72px;background:#f8f6fc}.visual{display:block;width:100%}.ctrl{position:absolute;top:14px;z-index:4;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#5730bd;font-size:22px;box-shadow:0 2px 8px #0002}.back{left:12px}.bell{right:12px}.badge{position:absolute;right:-2px;top:-2px;background:#e53232;color:#fff;border-radius:10px;padding:2px 5px;font-size:9px}.nav{position:absolute;bottom:0;left:0;right:0;height:70px;background:#fff;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eee;z-index:5}.nav button{border:0;background:none;font-size:10px;font-weight:800;color:#716b7f}.nav .active{color:#6034c8}.sheet{display:none;position:absolute;inset:0;background:#0005;z-index:10}.box{position:absolute;left:12px;right:12px;bottom:78px;background:#fff;border-radius:24px;padding:18px;max-height:70%;overflow:auto}.box h3{margin:0 0 10px;color:#5630be}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
</style></head><body><div class="phone"><div id="screen" class="screen"></div><div id="sheet" class="sheet" onclick="closeSheet()"><div class="box" id="box" onclick="event.stopPropagation()"></div></div></div>
<script>
const S={home:["portada.png","Inicio"],birth:["cumpleanos.png","Cumpleaños"],free:["juego_libre.png","Juego libre"],clients:["clientes.png","Clientes"],detail:["cliente_detalle.png","Cliente"],alerts:["avisos.png","Avisos"],deposits:["depositos.png","Depósitos"],depositDetail:["deposito_detalle.png","Detalle del depósito"]};let cur="home";
function nav(){return `<div class="nav"><button class="${cur==='home'?'active':''}" onclick="go('home')">⌂<br>Inicio</button><button class="${cur==='birth'?'active':''}" onclick="go('birth')">🎂<br>Cumpleaños</button><button class="${cur==='free'?'active':''}" onclick="go('free')">🦘<br>Juego libre</button><button class="${cur==='clients'||cur==='detail'?'active':''}" onclick="go('clients')">👥<br>Clientes</button><button class="${cur.includes('alert')||cur.includes('deposit')?'active':''}" onclick="go('alerts')">🔔<span class="badge">2</span><br>Avisos</button></div>`}
function go(x){cur=x;let [img,title]=S[x];let back=x==="home"?"":`<button class="ctrl back" onclick="go('${x==='depositDetail'?'deposits':x==='deposits'?'alerts':x==='detail'?'clients':'home'}')">‹</button>`;document.getElementById("screen").innerHTML=`<img class="visual" src="${img}" alt="${title}">${back}<button class="ctrl bell" onclick="go('alerts')">🔔<span class="badge">2</span></button>${nav()}`}
function openSheet(t){let c="";if(t==="food")c="<h3>🍴 Comida</h3><div class='line'><span>Comida niños</span><b>Personalizada</b></div><div class='line'><span>Picoteo padres</span><b>3 opciones editables</b></div><div class='line'><span>⚠️ Alergias</span><b>Editable</b></div>";if(t==="extras")c="<h3>⭐ Extras editables</h3>"+["Opción 1 · Consola","Opción 2 · Suelo es lava","Opción 3 · Cono de chuches","Opción 4 · Globos de helio","Opción 5 · Libre"].map(x=>`<div class='line'><span>${x}</span><b>Precio editable</b></div>`).join("");if(t==="visits")c="<h3>📋 Historial</h3>"+["15/08/2026 · 17:10 · 1 h","02/08/2026 · 18:00 · 1 h","26/07/2026 · 17:30 · 1 h","19/07/2026 · 16:45 · 1 h"].map(x=>`<div class='line'><span>${x}</span><b>✓</b></div>`).join("");if(t==="deposit")c="<h3>💶 Depósito</h3><div class='line'><span>🔴 Pendiente</span><b>No pagado</b></div><div class='line'><span>🟢 Pagado</span><b>Ya recibido</b></div>";document.getElementById("box").innerHTML=c;document.getElementById("sheet").style.display="block"}
function closeSheet(){document.getElementById("sheet").style.display="none"}go("home");
</script></div></body></html>
